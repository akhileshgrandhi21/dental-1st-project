services:
  - type: web
    name: hospital-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        value: postgresql://postgres.blsehhqrmbpwkplitzsq:Akhilesh12%40@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres
      - key: HOSPITAL_NAME
        value: ABC Hospital
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: DEFAULT_SLOT_DURATION
        value: "30"
      - key: VERSION
        value: "1.0.0"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /health
    autoDeploy: true
